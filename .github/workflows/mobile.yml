name: Manual mobile artifacts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile artifact to build
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios-simulator

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  android:
    name: Android APK (unsigned POC)
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          test -n "$ANDROID_HOME"
          java -version

      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Bundle unsigned Android APK
        run: >-
          dx bundle --android --release --package janata-ui
          --no-default-features --features mobile --package-types apk
          --target aarch64-linux-android --out-dir dist/mobile/android
          --cargo-args=--locked

      - name: Generate Android checksums
        shell: bash
        run: |
          cd dist/mobile/android
          find . -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janata-android-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/mobile/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  ios-simulator:
    name: iOS simulator app (unsigned POC)
    if: inputs.platform == 'both' || inputs.platform == 'ios-simulator'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust and iOS simulator target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios-sim
          rustup default "$RUST_TOOLCHAIN"
          xcodebuild -version

      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Bundle unsigned iOS simulator app
        run: >-
          dx bundle --ios --release --package janata-ui
          --no-default-features --features mobile --target aarch64-apple-ios-sim
          --package-types ios --codesign=false --out-dir dist/mobile/ios
          --cargo-args=--locked

      - name: Archive simulator app and generate checksum
        shell: bash
        run: |
          app_path="$(find dist/mobile/ios -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p dist/mobile/ios-artifact
          ditto -c -k --sequesterRsrc --keepParent "$app_path" dist/mobile/ios-artifact/janata-ios-simulator.zip
          cd dist/mobile/ios-artifact
          shasum -a 256 janata-ios-simulator.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janata-ios-simulator-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/mobile/ios-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
