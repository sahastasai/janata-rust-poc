name: CI and security gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  rust-quality:
    name: Rust formatting, lint, tests, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Build strict rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  target-builds:
    name: Dioxus, Worker, and Spacetime target checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native mobile check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install pinned Rust toolchain and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build Dioxus web release
        run: >-
          dx build --web --release --package janata-ui
          --no-default-features --features web --cargo-args=--locked

      - name: Check Dioxus mobile feature on Linux host
        run: >-
          cargo check --package janata-ui --no-default-features
          --features mobile --locked

      - name: Build Cloudflare Worker WebAssembly
        run: >-
          cargo build --package janata-worker-api --target wasm32-unknown-unknown
          --release --locked

      - name: Compile SpacetimeDB module to WebAssembly
        run: >-
          cargo build --package janata-spacetime-module --target wasm32-unknown-unknown
          --release --locked

  book-and-benchmarks:
    name: Contributor book and benchmark harness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Build mdBook
        run: |
          cargo install mdbook --version 0.4.52 --locked
          mdbook build docs/book

      - name: Install Bun 1.3.7
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.7

      - name: Install benchmark dependencies from lockfile
        working-directory: benchmarks
        run: bun install --frozen-lockfile

      - name: Type-check benchmark harness
        working-directory: benchmarks
        run: bun run check

      - name: Test benchmark harness
        working-directory: benchmarks
        run: bun test

  supply-chain:
    name: Advisories and dependency license metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Audit Rust vulnerabilities and report informational advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Require dependency license metadata
        run: |
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/cargo-metadata.json"
          jq -e '[.packages[] | select(.source != null) | select(.license == null and .license_file == null)] | length == 0' \
            "$RUNNER_TEMP/cargo-metadata.json"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan committed history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
