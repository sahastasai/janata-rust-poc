[workspace]
resolver = "2"
members = [
  "apps/janata-ui",
  "crates/api-contract",
  "crates/domain",
  "crates/spacetime-module",
  "crates/worker-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sahastasai/janata-rust-poc"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
uuid = { version = "1.24.0", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

[profile.web-release]
inherits = "release"
opt-level = "z"
